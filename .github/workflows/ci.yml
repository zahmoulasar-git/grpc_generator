name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer protoc (necessaire pour tonic-prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Compiler le projet
        run: cargo build --verbose

      - name: Lancer les tests unitaires
        run: cargo test --verbose

      - name: Test d'integration - pipeline complet (generation, build, test, packaging)
        run: cargo run -- examples/user.proto

      - name: Recuperer l'artefact .crate genere
        uses: actions/upload-artifact@v4
        with:
          name: user-proto-generated-crate
          path: examples/user.proto.generated_lib/target/package/*.crate

      - name: Publier une Release GitHub (uniquement sur un tag de version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: examples/user.proto.generated_lib/target/package/*.crate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
