[package]
name = "grpc_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
tonic = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-build = "0.14"
